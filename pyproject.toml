[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdss"
version = "0.1.0"
description = "Clinical Decision Support System with Evidence Retrieval Confidence & Hard Safety Gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "qdrant-client>=1.8.0",
    "bm25s>=0.1.6",
    "sentence-transformers>=2.5.0",
    "spacy>=3.7.0",
    "medspacy>=1.0.0",
    "instructor>=1.0.0",
    "ollama>=0.1.7",
    "redis>=5.0.0",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "pymupdf>=1.23.0",
    "unstructured>=0.12.0",
    "pytesseract>=0.3.10",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
asyncio_mode = "auto"
